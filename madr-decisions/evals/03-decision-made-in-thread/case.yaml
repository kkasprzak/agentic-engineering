schema_version: "1.1"
name: 03-decision-made-in-thread
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    We benchmarked it this week: gRPC came out at 40 ms p99 against 180 ms for the REST path, on the
    room-join call. That is the whole reason — nothing else changed. We are moving internal traffic
    to gRPC. Write this down.
