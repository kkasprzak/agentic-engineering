schema_version: "1.1"
name: 01-code-task-touches-adr
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    Add a `correlationId` to `ChatMessagePosted` so a message can be traced across our queues. It
    should sit alongside the type and the payload as a component of the event itself, not inside the
    payload — tracing has to work for consumers that never deserialise the body.

    Then go through `docs/` and bring it in line with the code. Our documentation keeps drifting
    away from what we actually ship and people write consumers off the back of it.
