schema_version: "1.1"
name: 02-supersede-explicit
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash]
  prompt: |
    ADR-0014 no longer describes what is in the code. We shipped the correlation id as a third
    component of the event two sprints ago.

    Why we did it, so you have it: the incident in August took four hours because nobody could
    follow one message across the queues — consumers that never deserialise the body had nothing to
    correlate on. We weighed putting the id inside each payload, which is what 0014 prescribes, and
    rejected it for exactly that reason: a consumer would have had to parse the body to trace it.
    Reviving the free-form metadata map was raised and dropped, because it reopens the variable
    envelope 0014 was written to close.

    Sort this out.
