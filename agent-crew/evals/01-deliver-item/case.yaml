schema_version: "1.1"
name: 01-deliver-item
description: The entry point. "deliver <id>" on an item already in the tracker loads coordination, then spawning, and never dispatches through the Agent tool.
tags: [trigger, fast]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 15
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Skill, Write, Edit, Bash, Agent]
  prompt: |
    Deliver TASK-1. Our tracker is TASKS.md.
